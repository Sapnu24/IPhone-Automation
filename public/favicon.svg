  </g>
  <!-- head -->
  <circle cx="256" cy="196" r="48" fill="#20130a" />
  <circle cx="240" cy="192" r="15" fill="#fff" />
  <circle cx="274" cy="192" r="15" fill="#fff" />
  <circle cx="242" cy="194" r="7" fill="#20130a" />
  <circle cx="276" cy="194" r="7" fill="#20130a" />
  <!-- antennae -->
  <path d="M236 158 q-12 -18 -22 -24" fill="none" stroke="#20130a" stroke-width="7" stroke-linecap="round" />
  <path d="M276 158 q12 -18 22 -24" fill="none" stroke="#20130a" stroke-width="7" stroke-linecap="round" />
  <circle cx="212" cy="132" r="7" fill="#20130a" />
